[package]
name = "ix-board"
version = "0.12.0"
edition = "2024"
rust-version = "1.98.1"
description = "Deterministic, cached Linear project and ready-work reads."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/ix-board"
publish = false

[lib]
name = "ix_board"
path = "src/lib.rs"

[[bin]]
name = "ix-board"
path = "src/main.rs"

[[bin]]
name = "ix-team-exporter"
path = "src/bin/ix-team-exporter.rs"

[dependencies]
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }
relay-work-wire = { git = "https://github.com/agent-ix/ix-relay", rev = "d3027cf5ec33d16132f3d24b9600e85853588a64" }
relay-core = { git = "https://github.com/agent-ix/ix-relay", rev = "d3027cf5ec33d16132f3d24b9600e85853588a64" }
# Shared CLI foundation: exit taxonomy, stream discipline, canonical JSON,
# version provenance, config precedence. Follow main; Cargo.lock records the
# resolved commit (see agent-ix/ix-cli-kit README, "Consuming this crate").
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main", features = ["secrets"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
schemars = "1.2"
rpassword = "7"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
