[package]
name = "ix-board"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Keeps the Linear dependency graph honest: resolves dependencies written in ticket prose, reports every reference it cannot resolve, and never silently drops one."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/ix-board"
publish = false

[lib]
name = "ix_board"
path = "src/lib.rs"

[[bin]]
name = "ix-board"
path = "src/main.rs"

[dependencies]
# Shared CLI foundation: exit taxonomy, stream discipline, canonical JSON,
# version provenance, config precedence. Consumed by git-rev pin — one rev
# string, no vendoring and no tag pin (see agent-ix/ix-cli-kit README,
# "Consuming this crate").
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", rev = "911666e4e316faa77e6e23d4f9f95f1ecb0f0def" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
directories = "5"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
futures = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
