[licenses]
version = 2
# Exactly the licenses the current graph carries. A new dependency adds its
# license in the same commit; a generous list is a noisy one and enforces less.
#
# AGPL-3.0-or-later: this crate's own license, and ix-cli-kit's.
# MPL-2.0: option-ext, pulled in transitively by `directories` -> dirs-sys.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
