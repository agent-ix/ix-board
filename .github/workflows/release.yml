name: Release

# A vX.Y.Z tag attaches the Linux x86_64 binary. The macOS asset is attached
# separately; both land on the same GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin ix-board

      - name: Package ix-board
        run: |
          mkdir -p dist/stage
          cp target/release/ix-board LICENSE dist/stage/
          tar -C dist/stage -czf "dist/ix-board-${GITHUB_REF_NAME}-${TARGET}.tar.gz" ix-board LICENSE
          rm -rf dist/stage

      - name: Write checksum
        working-directory: dist
        run: sha256sum "ix-board-${GITHUB_REF_NAME}-${TARGET}.tar.gz" > "ix-board-${GITHUB_REF_NAME}-${TARGET}.tar.gz.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
